[package]
name = "agent-replay"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Step through coding-agent session logs and export a shareable HTML timeline"
license = "MIT"
repository = "https://github.com/notzenco/agent-replay"
readme = "README.md"
keywords = ["ai", "agents", "replay", "tui", "claude-code"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
similar = "3.2.1"
time = { version = "0.3.55", features = ["formatting", "macros", "parsing"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[[bin]]
name = "agent-replay"
path = "src/main.rs"

[lib]
name = "agent_replay"
path = "src/lib.rs"
